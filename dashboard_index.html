<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cliproom | Publishing Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f3ee;
      --panel: #ffffff;
      --ink: #1c231f;
      --muted: #68716b;
      --line: #dfe3dc;
      --lime: #d3ef62;
      --coral: #e57961;
      --teal: #176f63;
      --shadow: 0 16px 38px rgba(32, 46, 37, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "DM Sans", "Avenir Next", sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .masthead { background: var(--ink); color: #f5f6ef; padding: 0 4.5vw; }
    .masthead-inner { min-height: 72px; max-width: 1480px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; gap: 12px; align-items: center; font-weight: 800; font-size: 17px; }
    .brand-mark { width: 27px; height: 27px; display: grid; place-items: center; background: var(--lime); color: var(--ink); border-radius: 7px; font-size: 13px; }
    .brand small { display: block; margin-top: 2px; color: #adb6ad; font: 10px "DM Mono", monospace; letter-spacing: 0; text-transform: uppercase; }
    .server-state { display: flex; align-items: center; gap: 8px; color: #cbd1c9; font-size: 12px; }
    .state-dot { width: 8px; height: 8px; background: var(--lime); border-radius: 50%; }
    .shell { max-width: 1480px; margin: auto; padding: 34px 4.5vw 64px; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 26px; }
    .eyebrow { color: var(--teal); font: 11px "DM Mono", monospace; text-transform: uppercase; margin: 0 0 9px; }
    h1 { font-size: 34px; line-height: 1.05; margin: 0; letter-spacing: 0; }
    .intro-copy { color: var(--muted); font-size: 14px; margin: 9px 0 0; }
    .refresh { border: 1px solid var(--ink); color: var(--ink); background: transparent; padding: 10px 15px; border-radius: 5px; font-size: 13px; font-weight: 700; }
    .refresh:hover { background: var(--ink); color: white; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; border: 1px solid var(--line); background: var(--line); margin-bottom: 25px; }
    .stat { background: var(--panel); padding: 16px 20px; min-height: 86px; }
    .stat-label { color: var(--muted); font: 10px "DM Mono", monospace; text-transform: uppercase; }
    .stat-value { display: block; margin-top: 7px; font-size: 26px; line-height: 1; font-weight: 800; }
    .toolbar { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 22px; }
    .search { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 5px; background: white; padding: 11px 13px; outline: none; }
    .search:focus, input:focus, textarea:focus, select:focus { border-color: var(--teal); outline: 2px solid rgba(23,111,99,.13); }
    .filters { display: flex; gap: 5px; }
    .filter { border: 0; color: var(--muted); background: transparent; padding: 9px 11px; border-radius: 4px; font-size: 12px; font-weight: 700; }
    .filter.active { background: var(--lime); color: var(--ink); }
    .job { background: var(--panel); border: 1px solid var(--line); margin-bottom: 21px; box-shadow: var(--shadow); }
    .job-head { display: grid; grid-template-columns: minmax(200px, 280px) 1fr; gap: 22px; padding: 18px; border-bottom: 1px solid var(--line); }
    .source-frame { background: #151b18; aspect-ratio: 16 / 9; overflow: hidden; position: relative; }
    .source-frame video { width: 100%; height: 100%; object-fit: contain; }
    .source-missing { height: 100%; display: grid; place-items: center; color: #c6cec5; font: 11px "DM Mono", monospace; }
    .job-info { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .job-kicker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font: 10px "DM Mono", monospace; text-transform: uppercase; }
    .job-kicker a { color: var(--teal); text-decoration: none; }
    .job-info h2 { font-size: 19px; line-height: 1.25; margin: 12px 0 7px; overflow-wrap: anywhere; }
    .job-meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; }
    .job-count { margin-top: 13px; display: flex; gap: 7px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; color: #4b554e; font: 10px "DM Mono", monospace; text-transform: uppercase; }
    .clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 390px), 1fr)); gap: 0; }
    .clip-card { min-width: 0; padding: 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .clip-card:last-child { border-right: 0; }
    .cover { display: grid; grid-template-columns: minmax(0,1fr) 146px; min-height: 260px; background: #202a24; overflow: hidden; }
    .cover-copy { padding: 16px; color: white; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .cover-rank { color: var(--lime); font: 10px "DM Mono", monospace; text-transform: uppercase; }
    .cover-title { font-size: 18px; font-weight: 800; line-height: 1.08; margin: 12px 0 0; overflow-wrap: anywhere; }
    .cover img { width: 100%; height: 260px; object-fit: contain; background: #151b18; }
    .cover-placeholder { width: 146px; height: 260px; background: linear-gradient(145deg, #477b68, #a5b74d 52%, #e57961); }
    .clip-preview { width: 100%; height: 320px; display: block; margin: 12px 0; background: #151b18; object-fit: contain; }
    .clip-line { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin: 13px 0 10px; }
    .clip-line strong { font-size: 13px; }
    .clip-line span { color: var(--muted); font: 10px "DM Mono", monospace; }
    .reason { color: #5e6861; font-size: 12px; line-height: 1.5; margin: 0 0 12px; }
    .clip-actions { display: flex; align-items: center; gap: 8px; margin: 0 0 15px; }
    .action-link { text-decoration: none; color: var(--ink); border: 1px solid var(--line); padding: 7px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .action-link:hover { border-color: var(--teal); color: var(--teal); }
    .tabs { display: flex; border-bottom: 1px solid var(--line); gap: 18px; }
    .tab { position: relative; border: 0; background: transparent; color: var(--muted); padding: 9px 0; font-size: 11px; font-weight: 700; }
    .tab.active { color: var(--ink); }
    .tab.active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: var(--coral); }
    .platform-panel { display: none; padding-top: 13px; }
    .platform-panel.active { display: block; }
    .field { margin-bottom: 10px; }
    .field label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; color: #626c65; font: 9px "DM Mono", monospace; text-transform: uppercase; }
    .field input, .field textarea, .field select { width: 100%; color: var(--ink); background: #fbfcf9; border: 1px solid var(--line); border-radius: 3px; padding: 8px 9px; font-size: 12px; }
    .field textarea { min-height: 64px; resize: vertical; line-height: 1.4; }
    .field select { max-width: 180px; text-transform: capitalize; }
    .panel-actions { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 12px; }
    .save { border: 0; border-radius: 4px; background: var(--ink); color: white; padding: 9px 13px; font-size: 11px; font-weight: 700; }
    .save:hover { background: var(--teal); }
    .copy { border: 0; background: transparent; color: var(--teal); padding: 8px 0; font-size: 11px; font-weight: 700; }
    .save-state { min-height: 14px; color: var(--teal); font: 10px "DM Mono", monospace; }
    .empty { border: 1px dashed #bfc9bf; padding: 45px 20px; text-align: center; color: var(--muted); }
    .toast { position: fixed; right: 20px; bottom: 20px; padding: 11px 15px; background: var(--ink); color: white; border-left: 4px solid var(--lime); font-size: 12px; opacity: 0; transform: translateY(8px); transition: .2s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 760px) {
      .shell { padding: 25px 16px 44px; }
      .masthead { padding: 0 16px; }
      .intro { align-items: start; }
      h1 { font-size: 28px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .toolbar { align-items: stretch; flex-direction: column; }
      .filters { overflow-x: auto; }
      .filter { white-space: nowrap; }
      .job-head { grid-template-columns: 1fr; }
      .source-frame { max-width: 420px; }
      .clips { grid-template-columns: 1fr; }
      .clip-card { border-right: 0; }
    }
    @media (max-width: 420px) {
      .server-state { font-size: 0; }
      .intro { flex-direction: column; }
      .cover { grid-template-columns: minmax(0,1fr) 96px; min-height: 171px; }
      .cover img, .cover-placeholder { width: 96px; height: 171px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="brand-mark">C</span><span>cliproom<small>local publishing library</small></span></div>
      <div class="server-state"><span class="state-dot"></span> Docker service online</div>
    </div>
  </header>
  <main class="shell">
    <section class="intro">
      <div><p class="eyebrow">Content operations / Library</p><h1>Generated clips</h1><p class="intro-copy">Review each source run, polish platform copy, and track publishing state.</p></div>
      <button class="refresh" id="refresh">Refresh library</button>
    </section>
    <section class="stats" aria-label="Library totals">
      <div class="stat"><span class="stat-label">Source runs</span><strong class="stat-value" id="stat-jobs">0</strong></div>
      <div class="stat"><span class="stat-label">Clips</span><strong class="stat-value" id="stat-clips">0</strong></div>
      <div class="stat"><span class="stat-label">Ready across platforms</span><strong class="stat-value" id="stat-ready">0</strong></div>
      <div class="stat"><span class="stat-label">Published</span><strong class="stat-value" id="stat-uploaded">0</strong></div>
    </section>
    <section class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search source, title, or tag" aria-label="Search clips" />
      <div class="filters" role="group" aria-label="Filter clips">
        <button class="filter active" data-filter="all">All clips</button>
        <button class="filter" data-filter="draft">Needs prep</button>
        <button class="filter" data-filter="ready">Ready</button>
        <button class="filter" data-filter="uploaded">Uploaded</button>
      </div>
    </section>
    <section id="jobs" aria-live="polite"></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const jobsRoot = document.getElementById('jobs');
    let library = { jobs: [], summary: { jobs: 0, clips: 0, ready: 0, uploaded: 0 } };
    let activeFilter = 'all';
    let searchQuery = '';

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const dateLabel = timestamp => new Date(timestamp * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    const statuses = ['draft', 'ready', 'uploaded', 'scheduled', 'failed'];
    const platforms = {
      youtube: { title: 'YouTube Shorts', titleField: 'youtube_title_final', copyField: 'youtube_description_final', copyLabel: 'Description', statusField: 'youtube_upload_status' },
      tiktok: { title: 'TikTok', titleField: 'tiktok_title_id_final', copyField: 'tiktok_caption_final', copyLabel: 'Caption', statusField: 'tiktok_upload_status' },
      instagram: { title: 'Instagram Reels', titleField: 'instagram_title_final', copyField: 'instagram_caption_final', copyLabel: 'Caption', statusField: 'instagram_upload_status' },
    };

    function statusSelect(field, value) {
      return `<select data-field="${field}">${statuses.map(status => `<option value="${status}" ${value === status ? 'selected' : ''}>${status}</option>`).join('')}</select>`;
    }

    function platformPanel(job, clip, key) {
      const platform = platforms[key];
      const title = clip[platform.titleField] || '';
      const copy = clip[platform.copyField] || '';
      const tags = Array.isArray(clip.youtube_tags_final) ? clip.youtube_tags_final.join(', ') : (clip.youtube_tags_final || '');
      const titleField = key === 'youtube' ? 'youtube_title_final' : platform.titleField;
      return `<div class="platform-panel ${key === 'youtube' ? 'active' : ''}" data-panel="${key}">
        <div class="field"><label for="title-${escapeHtml(job.id)}-${clip.rank}-${key}">Title</label><input id="title-${escapeHtml(job.id)}-${clip.rank}-${key}" data-field="${titleField}" value="${escapeHtml(title)}" /></div>
        <div class="field"><label for="copy-${escapeHtml(job.id)}-${clip.rank}-${key}">${platform.copyLabel}</label><textarea id="copy-${escapeHtml(job.id)}-${clip.rank}-${key}" data-field="${platform.copyField}">${escapeHtml(copy)}</textarea></div>
        ${key === 'youtube' ? `<div class="field"><label for="tags-${escapeHtml(job.id)}-${clip.rank}">Tags · comma separated</label><input id="tags-${escapeHtml(job.id)}-${clip.rank}" data-field="youtube_tags_final" value="${escapeHtml(tags)}" /></div>` : ''}
        ${key === 'youtube' && clip.youtube_video_id ? `<div class="field"><label>YouTube video ID</label><input data-field="youtube_video_id" value="${escapeHtml(clip.youtube_video_id)}" /></div>` : ''}
        <div class="field"><label>Upload state</label>${statusSelect(platform.statusField, clip[platform.statusField] || 'draft')}</div>
        <div class="panel-actions"><button class="save" data-save="${key}" data-job="${escapeHtml(job.id)}" data-rank="${clip.rank}">Save ${key} settings</button><button class="copy" data-copy="${key}">Copy ${key === 'youtube' ? 'details' : 'caption'}</button></div>
        <div class="save-state" aria-live="polite"></div>
      </div>`;
    }

    function clipCard(job, clip) {
      const text = [clip.youtube_title_final, clip.title_indonesia, clip.tiktok_caption_final, ...(clip.youtube_tags_final || [])].join(' ').toLowerCase();
      const statusesForClip = ['youtube_upload_status', 'tiktok_upload_status', 'instagram_upload_status'].map(key => clip[key] || 'draft');
      if (activeFilter !== 'all' && !statusesForClip.includes(activeFilter)) return '';
      if (searchQuery && !text.includes(searchQuery)) return '';
      const thumbnail = clip.thumbnail_url
        ? `<img src="${escapeHtml(clip.thumbnail_url)}" alt="Cover: ${escapeHtml(clip.thumbnail_text || clip.youtube_title_final)}" loading="lazy" />`
        : '<div class="cover-placeholder" aria-hidden="true"></div>';
      const videoPreview = clip.video_url ? `<video class="clip-preview" controls preload="metadata" playsinline src="${escapeHtml(clip.video_url)}"></video>` : '';
      const videoLink = clip.video_url ? `<a class="action-link" href="${escapeHtml(clip.video_url)}" download="clip-rank-${clip.rank}.mp4">Download clip</a>` : '';
      const thumbLink = clip.thumbnail_url ? `<a class="action-link" href="${escapeHtml(clip.thumbnail_url)}" download="cover-rank-${clip.rank}.jpg">Download cover</a>` : '';
      return `<article class="clip-card" data-clip-card data-search="${escapeHtml(text)}">
        <div class="cover"><div class="cover-copy"><span class="cover-rank">Clip ${String(clip.rank).padStart(2, '0')} · ${escapeHtml(clip.viral_score ? `Score ${clip.viral_score}` : 'Selected cut')}</span><h3 class="cover-title">${escapeHtml(clip.thumbnail_text || clip.youtube_title_final || `Clip ${clip.rank}`)}</h3></div>${thumbnail}</div>
        <div class="clip-line"><strong>${escapeHtml(clip.youtube_title_final || `Rank ${clip.rank}`)}</strong><span>${Number(clip.duration || 0).toFixed(0)} SEC · ${escapeHtml(clip.status || 'rendered')}</span></div>
        ${clip.alasan ? `<p class="reason">${escapeHtml(clip.alasan)}</p>` : ''}
        ${videoPreview}
        <div class="clip-actions">${videoLink}${thumbLink}</div>
        <div class="tabs" role="tablist" aria-label="Platform settings">${Object.entries(platforms).map(([key, platform]) => `<button class="tab ${key === 'youtube' ? 'active' : ''}" role="tab" aria-selected="${key === 'youtube'}" data-tab="${key}">${platform.title}</button>`).join('')}</div>
        ${Object.keys(platforms).map(key => platformPanel(job, clip, key)).join('')}
      </article>`;
    }

    function render() {
      const summary = library.summary || {};
      document.getElementById('stat-jobs').textContent = summary.jobs || 0;
      document.getElementById('stat-clips').textContent = summary.clips || 0;
      document.getElementById('stat-ready').textContent = summary.ready || 0;
      document.getElementById('stat-uploaded').textContent = summary.uploaded || 0;
      const markup = (library.jobs || []).map(job => {
        const clips = (job.clips || []).map(clip => clipCard(job, clip)).join('');
        if (!clips) return '';
        const source = job.source_video_url
          ? `<video controls preload="metadata" src="${escapeHtml(job.source_video_url)}"></video>`
          : '<div class="source-missing">SOURCE VIDEO NOT FOUND</div>';
        const runId = job.source_url ? job.source_url.split('v=').pop().slice(0, 11) : job.id;
        return `<section class="job" data-job-section>
          <div class="job-head"><div class="source-frame">${source}</div><div class="job-info">
            <div class="job-kicker"><span>Source run</span><span>·</span><span>${escapeHtml(runId)}</span>${job.source_url ? `<a href="${escapeHtml(job.source_url)}" target="_blank" rel="noreferrer">Open source ↗</a>` : ''}</div>
            <h2>${escapeHtml(job.title)}</h2><div class="job-meta"><span>${escapeHtml(dateLabel(job.created_at))}</span><span>${(job.clips || []).length} clips in this run</span></div>
            <div class="job-count"><span class="chip">Source kept with run</span><span class="chip">${escapeHtml(job.id)}</span>${job.source_download_url ? `<a class="action-link" href="${escapeHtml(job.source_download_url)}" download>Full source file</a>` : ''}</div>
          </div></div><div class="clips">${clips}</div>
        </section>`;
      }).join('');
      jobsRoot.innerHTML = markup || '<div class="empty">No clips match this view.</div>';
    }

    async function loadJobs() {
      jobsRoot.innerHTML = '<div class="empty">Loading your library…</div>';
      try {
        const response = await fetch('/api/jobs');
        if (!response.ok) throw new Error(`Library request failed (${response.status})`);
        library = await response.json();
        render();
      } catch (error) {
        jobsRoot.innerHTML = `<div class="empty">Could not load library: ${escapeHtml(error.message)}</div>`;
      }
    }

    function toast(message) {
      const target = document.getElementById('toast');
      target.textContent = message;
      target.classList.add('show');
      setTimeout(() => target.classList.remove('show'), 2200);
    }

    document.addEventListener('click', async event => {
      const tab = event.target.closest('[data-tab]');
      if (tab) {
        const card = tab.closest('.clip-card');
        card.querySelectorAll('.tab').forEach(button => {
          const selected = button === tab;
          button.classList.toggle('active', selected);
          button.setAttribute('aria-selected', String(selected));
        });
        card.querySelectorAll('.platform-panel').forEach(panel => panel.classList.toggle('active', panel.dataset.panel === tab.dataset.tab));
        return;
      }
      const filter = event.target.closest('[data-filter]');
      if (filter) {
        activeFilter = filter.dataset.filter;
        document.querySelectorAll('.filter').forEach(button => button.classList.toggle('active', button === filter));
        render();
        return;
      }
      const copyButton = event.target.closest('[data-copy]');
      if (copyButton) {
        const panel = copyButton.closest('.platform-panel');
        const text = [...panel.querySelectorAll('input, textarea')].map(field => field.value).filter(Boolean).join('\n\n');
        await navigator.clipboard.writeText(text);
        toast('Platform copy copied');
        return;
      }
      const saveButton = event.target.closest('[data-save]');
      if (saveButton) {
        const panel = saveButton.closest('.platform-panel');
        const fields = Object.fromEntries([...panel.querySelectorAll('[data-field]')].map(field => [field.dataset.field, field.value]));
        const state = panel.querySelector('.save-state');
        state.textContent = 'Saving…';
        try {
          const response = await fetch('/api/clip-settings', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ job_id: saveButton.dataset.job, rank: saveButton.dataset.rank, fields }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Save failed');
          state.textContent = 'Saved';
          toast('Clip settings saved');
        } catch (error) {
          state.textContent = error.message;
        }
      }
    });

    document.getElementById('search').addEventListener('input', event => {
      searchQuery = event.target.value.trim().toLowerCase();
      render();
    });
    document.getElementById('refresh').addEventListener('click', loadJobs);
    loadJobs();
  </script>
</body>
</html>
